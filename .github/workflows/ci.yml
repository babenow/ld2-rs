name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 retired GitHub-ом 2026-11-02 → миграция на macos-15 (arm64).
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml фиксирует stable + rustfmt/clippy (CONTRIBUTING §1)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Системные зависимости gpui (xkbcommon/fontconfig/wayland) — M10.1.
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libwayland-dev \
            libx11-dev libxcb1-dev

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

  # Реальный сервер (PLAN-M12.1, D24): тесты с БД — только здесь; в матрице
  # 3 ОС LD2_TEST_DATABASE_URL не задан и эти тесты пропускаются.
  server:
    name: ld2-server (postgres)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ld2
          POSTGRES_PASSWORD: ld2
          POSTGRES_DB: ld2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ld2 -d ld2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      LD2_TEST_DATABASE_URL: postgres://ld2:ld2@127.0.0.1:5432/ld2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (-D warnings)
        run: cargo clippy -p ld2-server --all-targets -- -D warnings

      - name: test (с PostgreSQL)
        run: cargo test -p ld2-server
