[workspace]
resolver = "2"
members = [
    "crates/ld2-protocol",
    "crates/ld2-mock-server",
    "crates/ld2-core",
    "crates/ld2-client",
    "crates/ld2-client-gpui",
    "crates/ld2-server",
    "crates/ld2-test-kit",
]

[workspace.package]
version = "0.9.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
# Реальный сервер (PLAN-M12): D23 — axum (WS + /healthz + graceful shutdown),
# D24 — sqlx: runtime-запросы (сборка без DATABASE_URL), авто-миграции, rustls
# без системного OpenSSL (важно для Windows-сборки и Docker). ws — транспорт §1.
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4"
# OS-уведомления (D7): zbus-бэкенд — без системной libdbus в CI.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Проверка обновлений (НФР/§12): лёгкий синхронный HTTP.
ureq = "2"
directories = "6"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# UI
eframe = "0.37"
# gpui (D16/ADR-004: crates.io-снапшот gpui Zed, жёсткий пин =0.3.10 —
# ровно столько требует Ely 0.1.x; git-пин v1.26.2 снят вместе со стабом
# gpui_web: wasm-бэкенд из графа уходит, конфликт unicode-properties неактуален).
# gpui_platform: font-kit (macOS), wayland/x11 (Linux) — «safe cross-platform
# default» из README gpui; Windows фичи не требуются (Win32/DirectWrite).
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
# Ely (D17/M11): компонентная библиотека поверх gpui — Dialog/Tooltip/формы/тема.
ely = { package = "ely-gpui-component", version = "=0.1.1" }

[profile.dev]
debug = 1
