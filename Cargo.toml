[workspace]
resolver = "2"
# Стаб gpui_web (wasm-only) — вне workspace, патчится в [patch] ниже.
exclude = ["vendor/gpui_web"]
members = [
    "crates/ld2-protocol",
    "crates/ld2-mock-server",
    "crates/ld2-core",
    "crates/ld2-client",
    "crates/ld2-client-gpui",
    "crates/ld2-server",
    "crates/ld2-test-kit",
]

[workspace.package]
version = "0.9.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
# Реальный сервер (PLAN-M12): D23 — axum (WS + /healthz + graceful shutdown),
# D24 — sqlx: runtime-запросы (сборка без DATABASE_URL), авто-миграции, rustls
# без системного OpenSSL (важно для Windows-сборки и Docker). ws — транспорт §1.
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4"
# OS-уведомления (D7): zbus-бэкенд — без системной libdbus в CI.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Проверка обновлений (НФР/§12): лёгкий синхронный HTTP.
ureq = "2"
directories = "6"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# UI
eframe = "0.37"
# gpui (D11: git-pin тега Zed — официальный crates.io устарел до platform-split).
# gpui_platform: font-kit (macOS), wayland/x11 (Linux) — «safe cross-platform
# default» из README gpui; Windows фичи не требуются (Win32/DirectWrite).
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2", features = ["font-kit", "wayland", "x11"] }

# Замена wasm-бэкенда Zed стабом: его пин unicode-properties =0.1.3
# конфликтует с epaint/egui 0.37 (^0.1.4) — см. vendor/gpui_web/Cargo.toml.
[patch."https://github.com/zed-industries/zed"]
gpui_web = { path = "vendor/gpui_web" }

[profile.dev]
debug = 1
