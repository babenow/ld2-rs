[workspace]
resolver = "2"
members = ["crates/ld2-protocol", "crates/ld2-mock-server", "crates/ld2-client"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4"
directories = "6"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# UI
eframe = "0.37"

[profile.dev]
debug = 1
