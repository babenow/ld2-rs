[package]
name = "gpui_web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Стаб gpui_web для native-сборки (см. PLAN-M10, риск D11)"

# Настоящий gpui_web (wasm-бэкенд Zed) пинит unicode-properties =0.1.3,
# что конфликтует с epaint (egui 0.37 → ^0.1.4): обе версии semver-
# совместимы, cargo обязан объединить их в одну — диапазоны пусты.
# gpui_platform зависит от gpui_web только под cfg(wasm) и в native-графе
# участвует лишь в resolution (никогда не компилируется) — стаб безопасен.
[features]
default = ["multithreaded"]
multithreaded = []
