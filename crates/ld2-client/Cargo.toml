[package]
name = "ld2-client"
version.workspace = true
edition.workspace = true
publish = false
description = "Десктоп-клиент ld2 (gpui + Ely, единственный UI-слой)"

[[bin]]
name = "ld2-gpui"
path = "src/main.rs"

[dependencies]
ld2-protocol = { path = "../ld2-protocol" }
serde_json = { workspace = true }
ld2-core = { path = "../ld2-core" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
ely = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
unicode-segmentation = "1"
# Иконка окна X11 (Linux): gpui WindowOptions.icon = Arc<image::RgbaImage>.
# Зависимость безусловная (тип нужен в сигнатуре на всех платформах),
# версия — та же, что в графе gpui (0.25): типы совпадают.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Windows: встраивание icon.ico в exe (проводник/таскбар/ярлыки).
# build.rs гейтит по CARGO_CFG_TARGET_OS — на других hosts это no-op.
winresource = { version = "0.1", default-features = false }
