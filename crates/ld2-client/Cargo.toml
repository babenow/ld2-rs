[package]
name = "ld2-client"
version.workspace = true
edition.workspace = true
description = "Десктоп-клиент ld2 (gpui + Ely, единственный UI-слой)"

[[bin]]
name = "ld2-gpui"
path = "src/main.rs"

[dependencies]
ld2-protocol = { path = "../ld2-protocol" }
serde_json = { workspace = true }
ld2-core = { path = "../ld2-core" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
ely = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
unicode-segmentation = "1"
