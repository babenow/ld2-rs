[package]
name = "ld2-server"
version.workspace = true
edition.workspace = true
description = "Реальный игровой сервер ld2: docs/protocol.md + PostgreSQL (PLAN-M12)"
publish = false

[dependencies]
anyhow.workspace = true
argon2 = "0.6"
axum.workspace = true
futures-util.workspace = true
getrandom = "0.3"
ld2-protocol = { path = "../ld2-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# e2e M13.2: ядро клиента (форма/валидация/register_error) против реального
# сервера — цикла нет: ld2-core не зависит от ld2-server.
ld2-core = { path = "../ld2-core" }
ld2-test-kit = { path = "../ld2-test-kit" }
ureq.workspace = true
