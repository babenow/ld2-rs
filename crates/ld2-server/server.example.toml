# server.example.toml — шаблон конфига ld2-server (PLAN-M12.1, D25).
#
# Локальный запуск:
#   cp crates/ld2-server/server.example.toml server.toml   # server.toml в .gitignore
#   chmod 600 server.toml                                  # в файле секреты (database.url)
#   cargo run -p ld2-server -- --config server.toml check # валидация без запуска
#
# Все настройки сервера — только здесь; env допускается исключительно для
# пути к файлу (--config / LD2_SERVER_CONFIG). Значения с точками (ключи
# §5) — в кавычках: "loot.roll" = false. Секции [server]/[gameplay] идут в
# evt/session.start (protocol.md §5) — это единственный источник лимитов/фич.

[server]
bind = "0.0.0.0:24817"     # WS-слушатель (в M12.1 отдаётся только /healthz)
name = "ld2-dev"           # → §5 server.name
region = "ru"              # → §5 server.region
# min_client = "0.11.0"    # опционально (§5): если задан — клиенты старше блокируются
log_level = "info"         # EnvFilter-директива: "info", "info,sqlx=warn"

[database]
# Секрет: не коммитить (server.toml в .gitignore), chmod 600.
url = "postgres://ld2:ld2@127.0.0.1:5432/ld2"
max_connections = 10

[auth]
access_ttl_s = 900         # D29: access-токен
refresh_ttl_s = 2592000    # D29: refresh-токен (дольше access)
register_enabled = true    # D28: cmd/auth.register
min_login_len = 3
min_password_len = 8

[gameplay]
char_slot_limit = 8        # → §5 char_slot_limit (DoD M2: конфиг, не код)
profession_limit = 2       # → §5 profession_limit

[gameplay.combat]           # M12.5: тик-луп атак (D25)
attack_interval_s = 1.0     # период атак в бою, с
base_damage = 6             # базовый урон персонажа (v1)
flee_chance = 0.5           # шанс cmd/combat.flee, 0..=1

[gameplay.features]        # → §5 features; неизвестные ключи разрешены
"loot.roll" = false
"respawn.inn" = true
"guild.bank" = false
"upgrade.rules" = "break_on_fail"
"trade.value_hint" = true
"chat.slash" = true

[gameplay.crime]           # §10: модель частичного сложения — только отсюда
t_max_s = 604800
blend_k = 0.5

[gameplay.crime.base]
murderer_s = 21600
marauder_s = 7200

[[gameplay.crime.kinds]]
kind = "murderer"
title = "Убийца"
severity = "high"

[[gameplay.crime.kinds]]
kind = "marauder"
title = "Мародёр"
severity = "medium"

[[gameplay.crime.kinds]]
kind = "thief"
title = "Вор"
severity = "medium"

[gameplay.chat]
server_history = 200       # размер кольцевой истории в БД
max_len = 500
cooldown_s = 1.5
channels = ["system", "location", "global", "party", "guild", "whisper"]

[gameplay.inventory]
slots = 40
equip_slots = ["head", "body", "main_hand", "staff", "feet"]

[gameplay.upgrade]
max_level = 9
preview = true
shows_chance = true
gold_base = 100         # стоимость улучшения +0 → +1 (золото)
gold_per_level = 50     # прибавка за уровень
chance_base = 0.9       # шанс успеха с +0
chance_per_level = 0.05 # снижение шанса за уровень

[gameplay.professions]  # skills.md §8 (D25)
rank_max = 7            # предел ранга профессии
xp_per_craft_base = 40  # XP за крафт: 40 + per_rank × ранг рецепта
xp_per_craft_per_rank = 25
xp_to_next_base = 80    # порог ранга: round(base × growth^rank)
xp_growth = 1.5
fail_xp_ratio = 0.2     # XP при неудаче

[gameplay.magic]
rune_recharge = "item"     # ADR-002
scroll_requires_target = true

[gameplay.magic.mana]      # ADR-002: мана
regen_out_s = 45
regen_in_pct_s = 1.0
rune_cost = 10

[world]
content_dir = "content"    # статический контент (JSON) → сид в PostgreSQL (D26)
tick_hz = 10               # тик-луп мира (D31), 1..=100
autosave_interval_s = 30   # периодический флаш онлайн-состояния (D27)

[skills]                   # skills.md §8: xp_to_next = round(base_xp × growth^rank)
base_xp = 120
growth = 1.32
rank_max = 30
kill_xp_base = 8
kill_xp_per_difficulty = 6

[[skills.gates]]           # ранг → требуемый атрибут (§2.2; E_REQUIREMENT_ATTR)
rank = 10
attr = 12

[[skills.gates]]
rank = 20
attr = 18

[[skills.gates]]
rank = 30
attr = 25
